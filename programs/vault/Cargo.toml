[package]
name = "vault"
version = "0.1.0"
description = "Soltempo Solana yield vault — receives cross-VM settlement intents from Tempo via CCIP, allocates to Kamino, settles payouts via mppsol_cpi"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = { version = "0.32.1", features = ["token", "token_2022"] }

[dev-dependencies]
# Used by drift-catcher tests to re-derive Anchor instruction
# discriminators (sha256 of "global:<name>"). solana-program 2.x split
# the hash module into a separate crate that anchor 0.32.1 doesn't
# re-export, so we just use sha2 directly.
sha2 = "0.10"

# TODO: when wiring real CPI to mppsol_cpi, add a path or git dependency.
# For v0.1 scaffolding, the CPI is structured but not invoked — see
# `settle_payout_to_tempo` in src/lib.rs.
